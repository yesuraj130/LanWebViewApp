name: AI Pull Request

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Gemini"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-edit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Gemini Version
        run: gemini --version

      - name: Create Branch
        run: |
          git checkout -b ai-${{ github.run_number }}

      - name: Create Prompt
        run: |
          cat > prompt.txt << EOF
          Repository: Android WebView application.

          Task:
          ${{ github.event.inputs.task }}

          Target file:
          app/src/main/java/com/app/MainActivity.java

          IMPORTANT:
          - Return ONLY valid Java source code.
          - Do NOT use markdown code fences.
          - Do NOT include explanations.
          - Preserve package declaration.
          - Preserve imports.
          - Output the complete file.
          EOF

      - name: Run Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        run: |
          gemini -p "$(cat prompt.txt)" > result.txt

      - name: Show Generated Output
        run: |
          head -50 result.txt

      - name: Replace MainActivity
        run: |
          cp result.txt app/src/main/java/com/app/MainActivity.java

      - name: Commit Changes
        run: |
          git config user.name "gemini-bot"
          git config user.email "gemini-bot@users.noreply.github.com"

          git add .
          git diff --cached --quiet && exit 0

          git commit -m "AI update"

      - name: Push Branch
        run: |
          git push --set-upstream origin ai-${{ github.run_number }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "AI Update #${{ github.run_number }}" \
            --body "Generated automatically by Gemini CLI" \
            --base main
