name: AI Pull Request

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Gemini"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-edit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Create branch
        run: |
          git checkout -b ai-${{ github.run_number }}

      - name: Generate instructions
        run: |
          cat > prompt.txt << 'EOF'
          Repository: Android WebView application.

          Task:
          ${{ github.event.inputs.task }}

          Modify only:
          app/src/main/java/com/app/MainActivity.java

          Return the complete updated file.
          EOF

      - name: Run Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gemini -p "$(cat prompt.txt)" > result.txt

      - name: Save result
        run: |
          cp result.txt app/src/main/java/com/app/MainActivity.java

      - name: Commit
        run: |
          git config user.name "gemini-bot"
          git config user.email "gemini-bot@users.noreply.github.com"
          git add .
          git commit -m "AI update"

      - name: Push
        run: |
          git push origin HEAD

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "AI Update" \
            --body "Generated by Gemini" \
            --base main
