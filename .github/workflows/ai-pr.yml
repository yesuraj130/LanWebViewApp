name: AI Pull Request

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Gemini"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-edit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Branch
        run: |
          git checkout -b ai-${{ github.run_number }}

      - name: Build Prompt
        run: |
          cat > prompt.txt << EOF
          Repository: Android WebView application.

          Task:
          ${{ github.event.inputs.task }}

          Target file:
          app/src/main/java/com/app/MainActivity.java

          IMPORTANT:
          - Return ONLY Java source code.
          - No markdown fences.
          - No explanations.
          - Output the complete file.
          EOF

      - name: Call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT=$(cat prompt.txt | jq -Rs .)

          cat > request.json << EOF
          {
            "contents": [
              {
                "parts": [
                  {
                    "text": $PROMPT
                  }
                ]
              }
            ]
          }
          EOF

          curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -d @request.json \
            > response.json

      - name: Extract Response
        run: |
          jq -r '.candidates[0].content.parts[0].text' response.json > result.txt

      - name: Show Output
        run: |
          head -50 result.txt

      - name: Replace MainActivity
        run: |
          cp result.txt app/src/main/java/com/app/MainActivity.java

      - name: Commit Changes
        run: |
          git config user.name "gemini-bot"
          git config user.email "gemini-bot@users.noreply.github.com"

          git add .

          git diff --cached --quiet && exit 0

          git commit -m "AI update"

      - name: Push Branch
        run: |
          git push --set-upstream origin ai-${{ github.run_number }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "AI Update #${{ github.run_number }}" \
            --body "Generated by Gemini API" \
            --base main
